<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Reel: 4 things I'll never let AI do</title>
<style>
/* Verticale reel 1080x1920 (24-11, proef goedgekeurd door Oussama). Hook in navy blokken, vier warme scènes (elk een
   eigen kleur/tijd van de dag, nummer + emoji + zin), "Everything else?" (stilte), dan "Automate it." met een lange lijst
   (14 taken) die omhoog schuift en elk vinkje een ping die steeds hoger klinkt, slot "Automate the work. Keep the people."
   Alle beweging per frame in zet(t) (opname_demo.py stuurt de klok). Veilige zone: x 230..850, y 230..1440. */
@font-face { font-family: Inter; font-weight: 100 900; src: url('../fonts/inter-latin.woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; background: #0F2547; }
em { font-style: normal; }
.laag { position: absolute; inset: 0; }
.kol { position: absolute; left: 190px; width: 700px; text-align: center; }
.w { display: inline-block; }
#start { background: radial-gradient(ellipse at 50% 38%, #23497F, #0F2547 75%); }
#hook { position: absolute; left: 140px; width: 800px; top: 640px; text-align: center; }
#hook .blok { display: inline-block; background: #17345F; color: #fff; padding: 10px 26px 16px; border-radius: 16px; font: 900 100px/1 Inter; letter-spacing: -.04em; margin-bottom: 12px;
  box-shadow: 0 14px 30px rgba(0,0,0,.35), 0 0 0 3px rgba(255,255,255,.08); }
#hook em { color: #FFC93C; }
.sc { opacity: 0; }
.nr { position: absolute; left: 0; width: 1080px; top: 260px; text-align: center; font: 900 160px/1 Inter; letter-spacing: -.06em; }
.emoji { position: absolute; left: 0; width: 1080px; top: 470px; text-align: center; font-size: 250px; line-height: 1; }
.emoji span { display: inline-block; filter: drop-shadow(0 30px 40px rgba(0,0,0,.25)); }
.zin { top: 830px; font: 900 86px/1.04 Inter; letter-spacing: -.045em; }
#rest { background: #101828; opacity: 0; }
#r1 { top: 780px; color: #fff; font: 900 120px/1.02 Inter; letter-spacing: -.05em; }
#auto { background: linear-gradient(180deg,#0F2547 0%,#17345F 100%); opacity: 0; }
#a1 { position: absolute; left: 0; width: 1080px; top: 240px; text-align: center; color: #FFC93C; font: 900 130px/1 Inter; letter-spacing: -.05em; z-index: 2; }
#venster { position: absolute; left: 200px; width: 680px; top: 470px; height: 960px; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 70px, #000 860px, transparent 980px); }
#takenlijst { position: absolute; left: 0; width: 680px; top: 60px; }
.taak { display: flex; align-items: center; gap: 22px; background: #fff; border-radius: 24px; padding: 18px 26px; font: 800 42px Inter; color: #101828; height: 92px; margin-bottom: 16px;
  box-shadow: 0 14px 34px rgba(0,0,0,.25); opacity: 0; }
.taak i { font-style: normal; width: 58px; height: 58px; border-radius: 16px; background: #12B76A; color: #fff; display: grid; place-items: center; font: 900 38px Inter; flex: none; }
#teller { position: absolute; left: 0; width: 1080px; top: 395px; text-align: center; font: 800 40px Inter; color: #9DBBE3; opacity: 0; z-index: 2; }
#teller b { color: #fff; font-weight: 900; font-variant-numeric: tabular-nums; }
#eind { background: radial-gradient(ellipse at 50% 38%, #23497F, #0F2547 75%); opacity: 0; }
#e1 { top: 470px; color: #fff; font: 900 100px/1.02 Inter; letter-spacing: -.05em; }
#e2 { top: 690px; color: #FFC93C; font: 900 100px/1.02 Inter; letter-spacing: -.05em; }
#e3 { top: 1030px; left: 0; width: 1080px; color: rgba(255,255,255,.9); font: 700 37px/1.2 Inter; letter-spacing: -.01em; white-space: nowrap; }
#voet { top: 1200px; left: 0; width: 1080px; display: flex; justify-content: center; align-items: center; gap: 16px; font: 700 40px Inter; color: #fff; opacity: 0; }
#flits { background: #fff; opacity: 0; }
</style>
</head>
<body>
<div class="scherm" style="display:none"><div id="camera"><div id="desk"></div></div></div>

<div class="laag" id="start"><div id="hook"><div><span class="blok" id="b1">4 things</span></div><div><span class="blok" id="b2">I'll never let</span></div><div><span class="blok" id="b3"><em>AI do.</em></span></div></div></div>
<div id="scenes"></div>
<div class="laag" id="rest"><div class="kol" id="r1"></div></div>
<div class="laag" id="auto"><div id="a1">Automate it.</div><div id="venster"><div id="takenlijst"></div></div><div id="teller"><b>0</b> tasks off your plate</div></div>
<div class="laag" id="eind">
  <div class="kol" id="e1"></div>
  <div class="kol" id="e2"></div>
  <div class="kol" id="e3">Follow for AI without the hype ⚡</div>
  <div class="kol" id="voet"><svg width="54" height="54" viewBox="0 0 44 44" fill="none"><rect x="19" y="6" width="6" height="32" rx="1" fill="#fff"/><path d="M8 36 Q14 28 22 22 Q30 16 36 8" stroke="#9DBBE3" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="8" cy="36" r="2.8" fill="#9DBBE3"/><circle cx="36" cy="8" r="2.8" fill="#9DBBE3"/></svg>@insightance.ai</div>
</div>
<div class="laag" id="flits"></div>

<script src="_demo.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const k = (t, a, d) => Math.min(1, Math.max(0, (t - a) / d));
const uit = (p) => 1 - Math.pow(1 - p, 3);
const veer = (p) => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p) * Math.cos(p * 9.5);
const pop = (el, t, a, van = 0.55, d = 0.3) => { const p = veer(k(t, a, d)); el.style.opacity = t >= a ? 1 : 0; el.style.transform = `scale(${van + (1 - van) * p})`; };
function woorden(el, html, t, start, stap) {
  if (!el.dataset.klaar) { el.innerHTML = html.split(" ").map((w) => w === "<br>" ? "<br>" : `<span class="w">${w}</span>`).join(" "); el.dataset.klaar = 1; }
  [...el.querySelectorAll(".w")].forEach((w, i) => pop(w, t, start + i * stap, 0.5, 0.28));
}
const NOOIT = [
  ["1", "🎂", "Call my best <br> customer on <br> his birthday.", "radial-gradient(circle at 78% 14%, rgba(255,244,190,.95), rgba(255,244,190,0) 25%), linear-gradient(180deg,#FFB86B 0%,#FFD8A8 55%,#FFF1DC 100%)", "#7A2E00", "#2A1200"],
  ["2", "🙏", "Say sorry <br> when we <br> mess up.", "radial-gradient(ellipse at 50% 18%, rgba(255,170,80,.35), rgba(255,170,80,0) 55%), linear-gradient(180deg,#1B1740 0%,#33245C 60%,#4D3159 100%)", "#FFC56B", "#fff"],
  ["3", "🤝", "Shake hands <br> on a deal.", "radial-gradient(circle at 50% 100%, rgba(255,255,255,.6), rgba(255,255,255,0) 50%), linear-gradient(180deg,#4FC1FF 0%,#97DAFF 55%,#E6F6FF 100%)", "#fff", "#0B2A4A"],
  ["4", "🧑‍🔧", "Decide who <br> joins my team.", "radial-gradient(ellipse at 50% 100%, rgba(255,190,140,.55), rgba(255,190,140,0) 60%), linear-gradient(180deg,#CBD8F0 0%,#E7E2F4 55%,#F9D9CB 100%)", "#D9572B", "#2B2540"],
];
const TAKEN = ["Invoices", "Payment reminders", "Quotes", "Follow-up emails", "Booking calls", "Appointment reminders", "Weekly reports", "Missed-call replies",
  "Review requests", "Lead follow-ups", "Data entry", "Order updates", "FAQ replies", "Onboarding emails"];
$("scenes").innerHTML = NOOIT.map(([n, e, z, bg, nk, zk], i) => `<div class="laag sc" id="s${i}" style="background:${bg}"><div class="nr" style="color:${nk}">${n}</div><div class="emoji"><span>${e}</span></div><div class="kol zin" id="z${i}" style="color:${zk}"></div></div>`).join("");
$("takenlijst").innerHTML = TAKEN.map((x) => `<div class="taak"><i>✓</i>${x}</div>`).join("");
const TK = [...$("takenlijst").children];
const S0 = 1.8, SD = 1.6, REST = S0 + 4 * SD, AUTO = REST + 1.2, STAP = 0.17, EIND = AUTO + 0.55 + TAKEN.length * STAP + 0.5;
window.__EIND = EIND;

function zet(t) {
  // hook
  [["b1", 0.0], ["b2", 0.15], ["b3", 0.3]].forEach(([id, a]) => {
    const p = veer(k(t, a, 0.14)); $(id).style.opacity = t >= a ? 1 : 0; $(id).style.transform = `scale(${1.35 - 0.35 * p})`;
  });
  $("start").style.transform = `scale(${1 + 0.03 * k(t, 0, S0)})`;
  // vier scènes: schuiven van rechts in, nummer plopt, emoji stuitert, zin woord voor woord
  NOOIT.forEach((_, i) => {
    const a = S0 + i * SD, s = $("s" + i), p = uit(k(t, a, 0.22));
    s.style.opacity = t >= a && t < a + SD + 0.3 ? 1 : 0;
    s.style.clipPath = `inset(0 0 0 ${(1 - p) * 100}%)`;
    s.style.transform = `scale(${1 + 0.03 * k(t, a, SD)})`;
    pop(s.querySelector(".nr"), t, a + 0.08, 0.4, 0.3);
    const em = s.querySelector(".emoji span"), pe = veer(k(t, a + 0.2, 0.45));
    em.style.opacity = t >= a + 0.2 ? 1 : 0;
    em.style.transform = `translateY(${(1 - pe) * 120}px) scale(${0.4 + 0.6 * pe}) rotate(${(1 - pe) * -18}deg)`;
    woorden($("z" + i), NOOIT[i][2], t, a + 0.4, 0.07);
  });
  // "Everything else?"
  $("rest").style.opacity = t >= REST && t < AUTO + 0.25 ? 1 : 0;
  woorden($("r1"), "Everything <br> else?", t, REST + 0.1, 0.18);
  // "Automate it." + lange lijst die omhoog schuift, ping per taak
  const pa = uit(k(t, AUTO, 0.2));
  $("auto").style.opacity = t >= AUTO ? (t < EIND + 0.3 ? 1 : 0) : 0;
  $("auto").style.clipPath = `inset(${(1 - pa) * 100}% 0 0 0)`;
  pop($("a1"), t, AUTO + 0.1, 0.5, 0.3);
  const rijH = 108, zichtbaar = 7;
  const n = TK.filter((_, i) => t >= AUTO + 0.55 + i * STAP).length;
  TK.forEach((r, i) => {
    const a = AUTO + 0.55 + i * STAP, p = veer(k(t, a, 0.28));
    r.style.opacity = t >= a ? 1 : 0;
    r.style.transform = `translateX(${(1 - p) * 120}px) scale(${0.8 + 0.2 * p})`;
    r.querySelector("i").style.transform = `scale(${0.3 + 0.7 * veer(k(t, a + 0.05, 0.25))})`;
  });
  // lijst schuift soepel mee zodra hij langer wordt dan het venster
  const doelScroll = Math.max(0, n - zichtbaar) * rijH;
  const vorige = Math.max(0, n - 1 - zichtbaar) * rijH, la = AUTO + 0.55 + (n - 1) * STAP;
  const scroll = vorige + (doelScroll - vorige) * uit(k(t, la, STAP));
  $("takenlijst").style.transform = `translateY(${-scroll}px)`;
  $("teller").style.opacity = t >= AUTO + 0.6 ? 1 : 0;
  $("teller").querySelector("b").textContent = n;
  // slot
  const pe = uit(k(t, EIND, 0.2));
  $("eind").style.opacity = t >= EIND ? 1 : 0;
  $("eind").style.clipPath = `inset(${(1 - pe) * 100}% 0 0 0)`;
  woorden($("e1"), "Automate <br> the work.", t, EIND + 0.15, 0.1);
  woorden($("e2"), "Keep the <br> people.", t, EIND + 0.7, 0.1);
  const p3 = uit(k(t, EIND + 1.3, 0.3));
  $("e3").style.opacity = p3; $("e3").style.transform = `translateY(${(1 - p3) * 30}px)`;
  const pv = uit(k(t, EIND + 1.6, 0.3));
  $("voet").style.opacity = pv; $("voet").style.transform = `translateY(${(1 - pv) * 30}px)`;
}
animeer(20000, () => zet(window.__klok / 1000));
window.__hook = function () {};
zet(0);
</script>
</body></html>
