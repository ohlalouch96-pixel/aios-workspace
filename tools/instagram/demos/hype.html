<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Reel: Everyone's selling you an AI agent (hype vs eerlijk advies)</title>
<style>
/* Verticale reel 1080x1920 (24-11, script goedgekeurd door Oussama). Kwaliteit zoals de robotvideo, ander verhaal:
   0-2,5 s  neonstraat (Pixabay 41957) + hook in navy blokken + nep-advertenties die opploppen (verzonnen, geen merken)
   2,5-4,5  snelle cut naar drukke straat (Pixabay 24603), steeds meer advertenties, beeld schudt
   4,5      harde stilte, in één klap licht: "I build them."
   6,0      "Most businesses don't need an agent yet."
   8,5      saaie takenlijst, één taak afgevinkt, teller +5 hours/week
   11,5     slot in de basiskleur (navy)
   Alle beweging per frame in zet(t) (opname_demo.py stuurt de klok). Clips: .tmp/instagram/hype_frames/a001-a078, b001-b066.
   Veilige zone: x 230..850, y 230..1440. */
@font-face { font-family: Inter; font-weight: 100 900; src: url('../fonts/inter-latin.woff2'); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; background: #000; }
em { font-style: normal; }
.laag { position: absolute; inset: 0; }
.kol { position: absolute; left: 230px; width: 620px; text-align: center; }
.w { display: inline-block; }

/* 1+2: clips + hype */
#clip { transform-origin: 540px 900px; }
#clip img { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; display: none; }
#clip img.zie { display: block; }
#waas { background: radial-gradient(ellipse at 50% 40%, rgba(8,6,20,.25), rgba(8,6,20,.75) 80%); }
#flits { background: #fff; opacity: 0; }
#hook { top: 250px; left: 190px; width: 700px; font: 900 82px/1 Inter; letter-spacing: -.04em; }
#hook .blok { display: inline-block; background: #17345F; color: #fff; padding: 10px 24px 16px; border-radius: 16px; margin: 0 0 12px;
  box-shadow: 0 14px 30px rgba(0,0,0,.45); transform-origin: 50% 60%; }
#hook em { color: #FFC93C; }
#buzz { top: 250px; font: 900 80px/1.06 Inter; letter-spacing: -.04em; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.7); opacity: 0; }
#buzz em { color: #FF5FD2; }
#niemand { top: 618px; font: 800 50px/1.1 Inter; letter-spacing: -.02em; opacity: 0; }
#niemand span { display: inline-block; background: #0B1020; color: #FFC93C; padding: 12px 26px 16px; border-radius: 14px; box-shadow: 0 0 0 3px rgba(255,201,60,.35), 0 14px 30px rgba(0,0,0,.5); }
.ad { position: absolute; opacity: 0; white-space: nowrap; font: 900 40px/1.1 Inter; letter-spacing: -.02em; padding: 22px 30px 24px; border-radius: 22px;
  box-shadow: 0 0 0 3px rgba(255,255,255,.12), 0 20px 50px rgba(0,0,0,.55); }
.ad small { display: block; font: 700 24px Inter; letter-spacing: .06em; text-transform: uppercase; opacity: .8; margin-bottom: 8px; }
.ad.roze { background: #FF2E93; color: #fff; box-shadow: 0 0 40px rgba(255,46,147,.65), 0 20px 50px rgba(0,0,0,.5); }
.ad.geel { background: #FFE14D; color: #1A1200; box-shadow: 0 0 40px rgba(255,225,77,.55), 0 20px 50px rgba(0,0,0,.5); }
.ad.cyaan { background: #0B1020; color: #3DF2FF; border: 3px solid #3DF2FF; box-shadow: 0 0 40px rgba(61,242,255,.55), 0 20px 50px rgba(0,0,0,.5); }
.ad.wit { background: #fff; color: #101828; }
.ad.paars { background: #7C3AED; color: #fff; box-shadow: 0 0 40px rgba(124,58,237,.7), 0 20px 50px rgba(0,0,0,.5); }
.ad .prijs { color: #FFE14D; }

/* 3: de breuk (licht) */
#licht { background: #F6F3EC; opacity: 0; }
#l1 { top: 620px; color: #101828; font: 900 130px/1 Inter; letter-spacing: -.05em; }
#l2 { top: 920px; color: #1F5EFF; font: 800 62px/1 Inter; letter-spacing: -.03em; }
#l3 { top: 520px; color: #101828; font: 900 96px/1.02 Inter; letter-spacing: -.045em; }
#l3 em { color: #1F5EFF; }
#flow { position: absolute; left: 230px; width: 620px; top: 1130px; height: 130px; }
#flow .n { position: absolute; top: 10px; width: 110px; height: 110px; border-radius: 30px; background: #fff; display: grid; place-items: center; font-size: 54px;
  box-shadow: 0 16px 36px rgba(16,24,40,.14), 0 0 0 2px #E4E7EC; opacity: 0; }
#flow .lijn { position: absolute; top: 62px; height: 6px; border-radius: 3px; background: #1F5EFF; transform-origin: 0 50%; transform: scaleX(0); }
#vraag { background: radial-gradient(ellipse at 50% 30%, #FFFFFF, #E3ECFF 70%); opacity: 0; }
#pil { position: absolute; left: 0; width: 1080px; top: 1060px; text-align: center; opacity: 0; }
#pil span { position: relative; display: inline-block; font: 900 64px Inter; letter-spacing: -.03em; color: #101828; background: #fff; padding: 22px 44px 26px;
  border-radius: 60px; box-shadow: 0 20px 50px rgba(31,94,255,.18), 0 0 0 3px #C9DAFF; }
#pil i { position: absolute; left: -16px; right: -16px; top: 50%; height: 12px; margin-top: -6px; background: #E5322D; border-radius: 6px; transform-origin: 0 50%; transform: scaleX(0) rotate(-4deg); }

/* 4: saaie taak */
#taak { background: radial-gradient(ellipse at 50% 100%, rgba(255,190,140,.55), rgba(255,190,140,0) 60%), linear-gradient(180deg, #FFF6E6 0%, #FDEBDC 100%); opacity: 0; }
#k1 { top: 300px; color: #101828; font: 900 72px/1.04 Inter; letter-spacing: -.04em; }
#k1 em { background: linear-gradient(transparent 62%, #FFE14D 62%); }
#lijst { position: absolute; left: 230px; width: 620px; top: 720px; background: #fff; border-radius: 40px; padding: 30px 40px;
  box-shadow: 0 40px 90px rgba(10,15,40,.18); opacity: 0; }
.rij { display: flex; align-items: center; gap: 26px; padding: 22px 0; font: 800 46px Inter; letter-spacing: -.02em; color: #101828; border-bottom: 2px solid #EEF0F4; }
.rij:last-child { border-bottom: 0; }
.vak { width: 60px; height: 60px; border-radius: 16px; border: 5px solid #D0D5DD; display: grid; place-items: center; flex: none;
  font: 900 40px Inter; color: #fff; }
.rij.af .vak { background: #12B76A; border-color: #12B76A; box-shadow: 0 8px 22px rgba(18,183,106,.45); }
.rij.af span { color: #067647; }
.rij.grijs { opacity: .38; }
#teller { position: absolute; left: 230px; width: 620px; top: 1250px; text-align: center; opacity: 0; }
#teller b { display: inline-block; font: 900 120px/1 Inter; letter-spacing: -.05em; color: #12B76A; font-variant-numeric: tabular-nums; }
#teller span { display: block; font: 800 46px Inter; color: #344054; letter-spacing: -.02em; margin-top: 6px; }

/* 5: slot */
#eind { background: radial-gradient(ellipse at 50% 38%, #23497F, #0F2547 75%); opacity: 0; }
#e1 { top: 400px; color: #fff; font: 900 110px/1.0 Inter; letter-spacing: -.05em; }
#e2 { top: 660px; color: #9DBBE3; font: 900 110px/1.0 Inter; letter-spacing: -.05em; }
#e2 em { color: #FFC93C; }
#e3 { top: 1030px; color: rgba(255,255,255,.9); font: 700 37px/1.2 Inter; letter-spacing: -.01em; white-space: nowrap; }
#voet { top: 1200px; display: flex; justify-content: center; align-items: center; gap: 16px; font: 700 40px Inter; color: #fff; opacity: 0; }
</style>
</head>
<body>
<div class="scherm" style="display:none"><div id="camera"><div id="desk"></div></div></div>

<div class="laag" id="clip"></div>
<div class="laag" id="waas"></div>
<div id="ads"></div>
<div class="kol" id="hook"><div><span class="blok" id="b1">Everyone's</span></div><div><span class="blok" id="b2">selling you an</span></div><div><span class="blok" id="b3"><em>AI agent.</em></span></div></div>
<div class="kol" id="buzz"></div>
<div class="kol" id="niemand"><span>Nobody tells you this.</span></div>

<div class="laag" id="licht">
  <div class="kol" id="l1"></div>
  <div class="kol" id="l2"></div>
  <div id="flow">
    <div class="lijn" id="fl1" style="left:110px;width:145px"></div><div class="lijn" id="fl2" style="left:365px;width:145px"></div>
    <div class="n" id="f1" style="left:0">📞</div><div class="n" id="f2" style="left:255px">⚙️</div><div class="n" id="f3" style="left:510px">✅</div>
  </div>
</div>
<div class="laag" id="vraag">
  <div class="kol" id="l3"></div>
  <div id="pil"><span>🤖 AI agent<i></i></span></div>
</div>

<div class="laag" id="taak">
  <div class="kol" id="k1"></div>
  <div id="lijst">
    <div class="rij grijs" id="r1"><div class="vak"></div><span>Missed calls</span></div>
    <div class="rij" id="r2"><div class="vak"></div><span>Quotes</span></div>
    <div class="rij grijs" id="r3"><div class="vak"></div><span>Invoices</span></div>
    <div class="rij grijs" id="r4"><div class="vak"></div><span>Emails</span></div>
  </div>
  <div id="teller"><b>+0</b><span>hours / week</span></div>
</div>

<div class="laag" id="eind">
  <div class="kol" id="e1"></div>
  <div class="kol" id="e2"></div>
  <div class="kol" id="e3">Follow for AI without the hype ⚡</div>
  <div class="kol" id="voet"><svg width="54" height="54" viewBox="0 0 44 44" fill="none"><rect x="19" y="6" width="6" height="32" rx="1" fill="#fff"/><path d="M8 36 Q14 28 22 22 Q30 16 36 8" stroke="#9DBBE3" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="8" cy="36" r="2.8" fill="#9DBBE3"/><circle cx="36" cy="8" r="2.8" fill="#9DBBE3"/></svg>@insightance.ai</div>
</div>
<div class="laag" id="flits"></div>

<script src="_demo.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const NA = 78, NB = 66, FPSR = 30, CUT = 2.5, BREUK = 4.5;
const vak = $("clip");
const laad = (p, n) => Array.from({ length: n }, (_, i) => { const im = new Image(); im.src = `../../../.tmp/instagram/hype_frames/${p}${String(i + 1).padStart(3, "0")}.jpg`; vak.appendChild(im); return im; });
const A = laad("a", NA), B = laad("b", NB);
const k = (t, a, d) => Math.min(1, Math.max(0, (t - a) / d));
const uit = (p) => 1 - Math.pow(1 - p, 3);
const veer = (p) => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p) * Math.cos(p * 9.5);
const pop = (el, t, a, van = 0.55, d = 0.3) => { const p = veer(k(t, a, d)); el.style.opacity = t >= a ? 1 : 0; el.style.transform = `scale(${van + (1 - van) * p})`; };
function woorden(el, html, t, start, stap) {
  if (!el.dataset.klaar) { el.innerHTML = html.split(" ").map((w) => w === "<br>" ? "<br>" : `<span class="w">${w}</span>`).join(" "); el.dataset.klaar = 1; }
  [...el.querySelectorAll(".w")].forEach((w, i) => pop(w, t, start + i * stap, 0.5, 0.28));
}
// nep-advertenties (verzonnen, geen echte merken): [tijd, x, y, draai, stijl, html]
const ADS = [
  [0.9, 70, 1000, -6, "roze", "<small>New · AI</small>Your 24/7 AI employee!"],
  [1.15, 520, 1170, 5, "geel", "Replace your whole team!"],
  [1.4, 120, 1340, -3, "cyaan", "<small>Agents</small>10x revenue with agents 🚀"],
  [1.65, 560, 860, 7, "paars", "Fully autonomous.<br>No humans needed."],
  [1.95, 90, 1530, 4, "wit", "<small>Limited offer</small>Only <b class='prijs' style='color:#FF2E93'>$499</b>/mo"],
  [2.2, 470, 1420, -7, "roze", "AI agent in 5 minutes!"],
  [2.6, 60, 760, 6, "geel", "<small>Copilot</small>Your new AI co-founder"],
  [2.8, 540, 700, -5, "cyaan", "GPT-powered sales bot 🤖"],
  [3.0, 150, 1180, -8, "wit", "<small>Act now</small>Never hire again"],
  [3.2, 500, 1000, 6, "paars", "Autonomous AI CEO"],
  [3.4, 80, 900, 3, "roze", "1,000 leads by Friday!"],
  [3.55, 560, 1300, -4, "geel", "<small>Last chance</small>Lifetime deal $997"],
  [3.7, 40, 1420, 8, "cyaan", "AI that runs your business"],
  [3.85, 430, 820, -9, "wit", "Agent swarm 2.0 ✨"],
  [4.0, 200, 1560, 5, "paars", "Zero staff. Infinite growth."],
  [4.12, 600, 1520, -6, "roze", "Book a demo NOW"],
  [4.24, 30, 1060, -2, "geel", "AI employees for $9/day"],
  [4.34, 470, 1650, 7, "cyaan", "Plug in. Get rich."],
];
const adsEl = $("ads");
const adEls = ADS.map(([a, x, y, r, stijl, html]) => {
  const el = document.createElement("div"); el.className = "ad " + stijl; el.innerHTML = html;
  el.style.left = x + "px"; el.style.top = y + "px"; el.dataset.r = r; adsEl.appendChild(el); return el;
});
const LICHT = 4.85, VRAAG = 6.3, TAAK = 8.6, EIND = 11.5;
function zet(t) {
  // 1. clips: A tot de cut, dan B; op de breuk bevriest het beeld (grijs), de advertenties vallen naar beneden
  const inA = t < CUT, bev = t >= BREUK;
  const tc = Math.min(t, BREUK);
  const idx = inA ? Math.min(NA - 1, Math.floor(Math.max(tc, 0) * FPSR)) : Math.min(NB - 1, Math.floor((tc - CUT) * FPSR));
  A.forEach((im, i) => im.classList.toggle("zie", inA && i === idx));
  B.forEach((im, i) => im.classList.toggle("zie", !inA && i === idx));
  const druk = k(t, 3.0, 1.5);
  const schud = !bev ? Math.sin(t * 87) * 14 * druk : (t < BREUK + 0.25 ? Math.sin(t * 95) * 22 * (1 - (t - BREUK) / 0.25) : 0);
  const zoom = inA ? 1.0 + 0.06 * (t / CUT) : 1.08 + 0.10 * uit(k(tc, CUT, 2.0));
  $("clip").style.transform = `translate(${schud}px, ${schud * 0.5}px) scale(${zoom})`;
  $("clip").style.filter = bev ? "grayscale(1) brightness(.5) contrast(1.2)"
    : inA ? "blur(2px) saturate(1.25) contrast(1.08)" : `saturate(1.6) contrast(1.15) brightness(${0.8 - 0.25 * druk}) hue-rotate(${-20 * druk}deg)`;
  $("waas").style.opacity = inA ? 0.85 : 0.95;
  // witte flits op de cut en op de breuk
  const fl = (a, s) => t >= a && t < a + 0.09 ? s * (1 - (t - a) / 0.09) : 0;
  $("flits").style.opacity = Math.max(fl(CUT, 0.55), fl(BREUK, 0.8));
  // hook: drie blokken knallen er binnen 0,3 s in, "Nobody tells you this." op 0,55 s; blokken weg op de cut
  [["b1", 0.0], ["b2", 0.12], ["b3", 0.26]].forEach(([id, a]) => {
    const p = veer(k(t, a, 0.14));
    $(id).style.opacity = t >= a && t < CUT ? 1 : 0;
    $(id).style.transform = `scale(${1.35 - 0.35 * p})`;
  });
  $("hook").style.transform = `translate(${schud * 0.4}px, 0)`;
  pop($("niemand"), t, 0.55, 0.5, 0.26);
  $("niemand").style.opacity = t >= 0.55 && t < LICHT ? 1 : 0;
  if (t >= CUT) $("niemand").style.transform = `translate(${schud * 0.5}px, 0)`;
  // buzzwoorden na de cut
  $("buzz").style.opacity = t >= CUT && t < LICHT ? 1 : 0;
  woorden($("buzz"), "Agents. Copilots. <br> <em>\"AI</em> <em>employees.\"</em>", t, CUT + 0.05, 0.16);
  $("buzz").style.transform = `translate(${schud * 0.5}px, 0)`;
  // advertenties ploppen op met een veer en trillen; op de breuk vallen ze weg (zwaartekracht, draaiend)
  adEls.forEach((el, i) => {
    const a = ADS[i][0], p = veer(k(t, a, 0.22));
    const val = bev ? Math.pow(Math.max(0, t - BREUK - i * 0.006), 2) * 9000 : 0;
    el.style.opacity = t >= a && t < LICHT ? 1 : 0;
    el.style.transform = `translateY(${val}px) rotate(${+el.dataset.r + (bev ? (t - BREUK) * (i % 2 ? 90 : -90) : Math.sin(t * 40 + i) * 1.5 * druk)}deg) scale(${0.4 + 0.6 * p})`;
  });

  // 2. de breuk: licht scherm groeit vanuit het midden, stilte. "I build them." + workflow die zichzelf bouwt
  const pl = uit(k(t, LICHT, 0.2));
  $("licht").style.opacity = t >= LICHT && t < VRAAG + 0.3 ? 1 : 0;
  $("licht").style.clipPath = `circle(${pl * 1400}px at 540px 760px)`;
  $("licht").style.transform = `scale(${1 + 0.035 * k(t, LICHT, 1.5)})`;
  woorden($("l1"), "I build them.", t, LICHT + 0.1, 0.12);
  pop($("l2"), t, LICHT + 0.6, 0.7, 0.3);
  $("l2").style.opacity = t >= LICHT + 0.6 ? 1 : 0;
  if (!$("l2").textContent) $("l2").textContent = "for a living.";
  [["f1", 5.55], ["f2", 5.8], ["f3", 6.05]].forEach(([id, a]) => pop($(id), t, a, 0.4, 0.3));
  [["fl1", 5.65], ["fl2", 5.9]].forEach(([id, a]) => $(id).style.transform = `scaleX(${uit(k(t, a, 0.2))})`);

  // 3. "Most businesses don't need an agent yet." op lichtblauw, schuift van rechts in; pil "AI agent" wordt doorgestreept
  const pv = uit(k(t, VRAAG, 0.22));
  $("vraag").style.opacity = t >= VRAAG && t < TAAK + 0.3 ? 1 : 0;
  $("vraag").style.clipPath = `inset(0 0 0 ${(1 - pv) * 100}%)`;
  $("vraag").style.transform = `scale(${1 + 0.035 * k(t, VRAAG, 2.3)})`;
  woorden($("l3"), "Most businesses <br> don't need <br> an agent <em>yet.</em>", t, VRAAG + 0.12, 0.13);
  pop($("pil"), t, 7.25, 0.6, 0.3);
  $("pil").style.opacity = t >= 7.25 ? 1 : 0;
  $("pil").querySelector("i").style.transform = `scaleX(${uit(k(t, 7.75, 0.18))}) rotate(-4deg)`;
  $("pil").querySelector("span").style.filter = t >= 7.9 ? "grayscale(1)" : "none";
  $("pil").querySelector("span").style.opacity = t >= 7.9 ? 0.75 : 1;

  // 4. saaie taak (warm, schuift van onder in)
  const pt = uit(k(t, TAAK, 0.2));
  $("taak").style.opacity = t >= TAAK && t < EIND + 0.3 ? 1 : 0;
  $("taak").style.clipPath = `inset(${(1 - pt) * 100}% 0 0 0)`;
  $("taak").style.transform = `scale(${1 + 0.03 * k(t, TAAK, 2.9)})`;
  woorden($("k1"), "They need <em>one</em> <em>boring</em> <em>task,</em> <br> automated properly.", t, TAAK + 0.1, 0.09);
  const plj = veer(k(t, TAAK + 0.55, 0.32));
  $("lijst").style.opacity = t >= TAAK + 0.55 ? 1 : 0;
  $("lijst").style.transform = `translateY(${(1 - plj) * 160}px) scale(${0.85 + 0.15 * plj})`;
  const AF = 9.8, af = t >= AF;
  $("r2").classList.toggle("af", af);
  $("r2").querySelector(".vak").textContent = af ? "✓" : "";
  $("r2").querySelector(".vak").style.transform = `scale(${af ? 0.6 + 0.4 * veer(k(t, AF, 0.3)) : 1})`;
  pop($("teller"), t, 10.05, 0.6, 0.3);
  $("teller").style.opacity = t >= 10.05 ? 1 : 0;
  $("teller").querySelector("b").textContent = "+" + Math.round(5 * uit(k(t, 10.1, 0.7)));

  // 5. slot: navy schuift van onder omhoog
  const pe = uit(k(t, EIND, 0.2));
  $("eind").style.opacity = t >= EIND ? 1 : 0;
  $("eind").style.clipPath = `inset(${(1 - pe) * 100}% 0 0 0)`;
  woorden($("e1"), "Start boring.", t, EIND + 0.15, 0.12);
  woorden($("e2"), "<em>Then</em> go big.", t, EIND + 0.85, 0.12);
  const p3 = uit(k(t, EIND + 1.6, 0.3));
  $("e3").style.opacity = p3; $("e3").style.transform = `translateY(${(1 - p3) * 30}px)`;
  const pvt = uit(k(t, EIND + 2.0, 0.3));
  $("voet").style.opacity = pvt; $("voet").style.transform = `translateY(${(1 - pvt) * 30}px)`;
}
animeer(18000, () => zet(window.__klok / 1000));
window.__hook = function () {};
zet(0);
</script>
</body></html>
