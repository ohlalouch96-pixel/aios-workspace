<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:100 900;src:url('../fonts/inter-latin.woff2')}
:root{--donker:#0A0A0A;--dfg:#FFFFFF;--acc:#D4F53C;--accfg:#0A0A0A;--licht:#F4F3EE;--lfg:#0A0A0A;--mark:#D4F53C;--pos:#5BB82E;--kaart:#1A1A1A;--rand:#2A2A2A;--grijs:#8A8A85}

html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter;-webkit-font-smoothing:antialiased}
body{background:var(--donker)}
#scene{position:absolute;inset:0;padding:250px 90px 480px;display:flex;flex-direction:column;justify-content:center}  /* midden van de veilige zone van Reels */

.kop{font-weight:800;font-size:92px;line-height:1.04;letter-spacing:-.035em}
.kop.klein{font-size:76px}
.hl{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 62%/calc(var(--hl,0)*100%) 78%;padding:0 6px;margin:0 -6px}
.donker .hl{color:var(--acc);background:none;text-shadow:0 0 calc(var(--hl,0)*40px) color-mix(in srgb,var(--acc) 55%,transparent)}
.typ{font-weight:600;font-size:58px;line-height:1.2;letter-spacing:-.02em;min-height:140px}

.kaart{background:#fff;border-radius:34px;box-shadow:0 30px 70px rgba(10,10,10,.12),0 2px 0 rgba(10,10,10,.04);padding:44px 48px;margin-top:40px}

.status{font-size:26px;font-weight:700;color:#C2410C;background:#FFEDD5;border-radius:30px;padding:10px 20px}

.agenda{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:20px 18px 24px}
.agenda .dag{font-size:26px;font-weight:700;color:#667085;text-align:center;padding-bottom:10px}
.agenda .kolom{position:relative;height:620px;background:repeating-linear-gradient(#fff 0 76px,#F2F4F7 76px 78px);border-radius:14px}
.blok{position:absolute;left:4px;right:4px;border-radius:12px;padding:8px 9px;font-size:23px;font-weight:700;line-height:1.15;background:#F2F4F7;color:#475467;overflow:hidden}
.blok small{display:block;font-size:19px;font-weight:500;opacity:.8;margin-top:2px}
.blok.nieuw{background:var(--mark);color:#101828;box-shadow:0 8px 20px rgba(16,24,40,.14);border:2px solid color-mix(in srgb,var(--mark) 60%,#101828)}

.mailrij .av{width:58px;height:58px;border-radius:50%;background:#EEF4FF;color:#1F5EFF;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:26px}
.mailrij .tekst{flex:1;min-width:0}.mailrij b{display:block;font-size:28px}.mailrij span.ond{display:block;color:#475467;font-size:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label{flex:none;font-size:21px;font-weight:700;border-radius:20px;padding:8px 16px;background:var(--mark);color:#101828}

<body>
<div id="scene"></div>
<div id="cap"></div>
<script>
const cl = x => Math.min(Math.max(x, 0), 1);
const E = x => 1 - Math.pow(1 - cl(x), 3);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const mk = (s, t) => esc(s).replace(/\*(.+?)\*/g, `<span class="hl" data-hl="${t}">$1</span>`);
const geld = v => '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
// Tijd (s, binnen de scène) waarop het woord wordt uitgesproken; anders de reservetijd.
const wt = (s, woord, reserve, nr = 0) => {
  const w = (s.woorden || []).filter(x => x.w.toLowerCase().replace(/[^a-z0-9']/g, '') === woord)[nr];
  return w ? w.s : reserve;
};
// Muisaanwijzer die op tijdstip k klikt (verschijnt 0,6 s eerder, met een klikring).
const cursor = (k, pos) => `<span style="position:absolute;${pos}">
  <span class="ring" data-ring="${k}" style="left:-30px;top:-30px;opacity:0"></span>
  <svg class="cursor" data-in="${k - .6}" data-klik="${k}" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.5L16 20l-3 1.5-3.5-7.5L4 18z" fill="#101828" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></span>`;
// Tijdstip waarop item n verschijnt: op het woord uit s.op[n] als Eric dat zegt, anders gelijk verdeeld over de scène.
const tijd = (s, n, d) => {
  const aantal = (s.items || []).length + 1;
  return wt(s, ((s.op || [])[n] || '').toLowerCase().replace(/[^a-z0-9']/g, ''), .5 + n * Math.max(.35, (d * .75 - .5) / aantal));
};
const IN = .7, UIT = .3;  // duur van in- en uitfaden (s); rustig genoeg om met je ogen te volgen

// Elke scène: HTML met tijdsattributen (seconden vanaf het begin van de scène, d = duur van de scène).
const SCENES = {
  getal: (s, d) => ({kleur: 'donker', html: `
    <div class="getal" data-in="0" data-count="${s.tot}" data-van="${s.van || 0}" data-t0="0.1" data-dur="${Math.min(1.4, d * .5)}" data-suf="${s.suf || ''}">0</div>
    <div class="typ" data-typ="${esc(s.tekst)}" data-t0="${Math.min(1.2, d * .35)}"></div>
    ${s.bron ? `<div class="bron" data-in="${d * .6}">${esc(s.bron)}</div>` : ''}`}),
  mandje: (s, d) => {
    const tot = s.items.reduce((a, i) => a + i[1], 0);
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, wt(s, "let", d * .45))}</div>
    <div class="kaart mandje" data-in="0.3">
      <h3>Your cart <span class="status" data-in="${d * .35}">${esc(s.status)}</span></h3>
      ${s.items.map((i, n) => `<div class="regel" data-dim="${wt(s, "go", d * .4) + n * .2}"><span class="nm"><span class="ic"></span>${esc(i[0])}</span><b>${geld(i[1])}</b></div>`).join('')}
      <div class="totaal" data-dim="${wt(s, "go", d * .4) + s.items.length * .2}"><span>Subtotal</span><span>${geld(tot)}</span></div>
    </div>`};
  },
  mails: (s, d) => ({kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, wt(s, s.hl || "email", d * .7))}</div>
    ${s.mails.map((m, n) => `<div class="kaart mail" data-in="${wt(s, (s.op || [])[n], .4 + n * d * .25)}">
      <span class="tijd">${esc(m[0])}</span>
      <div><div class="ond">${esc(m[1])}</div><div class="vz">${esc(m[2])}</div></div>
      <span class="ok" data-in="${wt(s, (s.op || [])[n], .4 + n * d * .25) + .5}">Sent ✓</span></div>`).join('')}`}),
  meldingen: (s, d) => ({kleur: 'donker', html: `
    <div class="klok" data-in="0">${esc(s.klok)}</div>
    ${s.meldingen.map((m, n) => `<div class="toast" data-in="${wt(s, (s.op || [])[n], .3 + n * d * .18)}"><span class="dot">$</span>
      <div><div class="t1">${esc(m[0])}</div><div class="t2">${esc(m[1])}</div></div><span class="bedrag">${geld(m[2])}</span></div>`).join('')}
    <div class="teller" data-in="${.3}" data-som='${JSON.stringify(s.meldingen.map((m, n) => [wt(s, (s.op || [])[n], .3 + n * d * .18), m[2]]))}'>$0.00</div>
    <div class="teller-lab" data-in="0.3">${esc(s.label)}</div>
    <div class="kop" style="margin-top:90px" data-in="${wt(s, "while", d * .62) - .15}">${mk(s.kop, wt(s, "sleep", d * .72))}</div>`}),
  // ---- offerte-video ----
  klok: (s, d) => ({kleur: 'donker', html: `
    <div class="klokgroot" data-in="0">${esc(s.tijd)}<small>${esc(s.ampm)}</small></div>
    <div class="typ" style="margin-top:50px" data-typ="${esc(s.tekst)}" data-t0="${wt(s, 'still', d * .35)}"></div>
    <div><span class="bestand" data-in="${wt(s, 'quotes', d * .55)}"><span class="doc">W</span>${esc(s.bestand)}<span class="bewerk">Editing…</span></span></div>`}),
  offerte: (s, d) => {
    const k = wt(s, 'job', d * .3) + .05, stap = Math.min(.22, Math.max(.12, (wt(s, 'itself', d * .7) - k) / s.regels.length));
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, wt(s, 'fills', d * .6))}</div>
    <div class="app" data-in="0.15">
      <div class="app-kop"><span class="logo">${esc(s.bedrijf[0])}</span><b>${esc(s.bedrijf)}</b><span class="nr">${esc(s.nummer)}</span><span class="pil">Draft</span></div>
      <div class="kies"><span class="ph" data-uit="${k}">Choose a job template…</span><span class="val" data-in="${k}">${esc(s.klus)}</span><span class="pijl">▾</span>
        ${cursor(k, 'right:60px;top:22px')}</div>
      <div class="tabel">${s.regels.map((r, i) => `<div class="rij" data-in="${k + .3 + i * stap}"><span>${esc(r[0])}${r[1] ? `<small>${esc(r[1])}</small>` : ''}</span><b>${geld(r[2])}</b></div>`).join('')}</div>
    </div>`};
  },
  totaal: (s, d) => {
    const sub = s.posten.reduce((a, p) => a + p[1], 0), btw = Math.round(sub * s.btw * 100) / 100, tot = sub + btw;
    const op = s.op || [];
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, wt(s, 'seconds', d * .7))}</div>
    <div class="app som" data-in="0.1">
      ${s.posten.map((p, i) => `<div class="rij" data-in="${wt(s, op[i], .3 + i * .4)}"><span>${esc(p[0])}</span><span>${geld(p[1])}</span></div>`).join('')}
      <div class="rij" data-in="${wt(s, op[s.posten.length], 1.2)}"><span>Sales tax ${Math.round(s.btw * 100)}%</span><span>${geld(btw)}</span></div>
      <div class="totaal-groot" data-in="${wt(s, 'worked', 1.6) - .1}"><span>Total</span><span data-count="${tot.toFixed(2)}" data-t0="${wt(s, 'worked', 1.6)}" data-dur="1.0" data-pre="$" data-dec="2">$0.00</span></div>
      <div class="aanbet" data-in="${wt(s, 'seconds', 2.4) + .2}">${Math.round(s.aanbetaling * 100)}% deposit on acceptance: <b>${geld(Math.round(tot * s.aanbetaling * 100) / 100)}</b></div>
    </div>`};
  },
  pdf: (s, d) => {
    const k = wt(s, 'sent', d * .5);
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, wt(s, 'driveway', d * .75))}</div>
    <div class="papier" data-in="0.15">
      <div class="bovenrij"><div class="merk"><span class="logo">${esc(s.bedrijf[0])}</span>${esc(s.bedrijf)}</div><div class="q">QUOTE<b>${esc(s.nummer)}</b></div></div>
      <div class="voor">Prepared for<b>${esc(s.klant)}</b>${esc(s.adres)}</div>
      <div class="mini">${(s.regels || []).slice(0, 3).map(r => `<div><span>${esc(r[0])}</span><span>${geld(r[1])}</span></div>`).join('')}
        ${(s.meer ? `<div class="meer">+ ${s.meer} more items</div>` : '')}</div>
      <div class="eind"><span>Total</span><span>${geld(s.totaal)}</span></div>
    </div>
    <div class="verstuur"><span class="knop-app">Send quote${cursor(k, 'right:-10px;top:40px')}</span></div>
    <div class="melding-app" data-in="${k + .35}"><i>✓</i><div>Quote sent to ${esc(s.klant)}<small>PDF attached · accept link included</small></div></div>`};
  },
  akkoord: (s, d) => ({kleur: 'donker', html: `
    <div class="kop" data-in="0">${mk(s.kop, wt(s, 'yes', d * .6))}</div>
    <div style="margin-top:60px">
      <div class="notif" data-in="${wt(s, 'see', .4)}"><span class="ic" style="background:#F79009">👁</span><div><div class="t1">${esc(s.klant.split(' ')[0])} opened your quote</div><div class="t2">Viewed 2 times · on mobile</div></div><span class="tijdje">9:16</span></div>
      <div class="notif groot" data-in="${wt(s, 'yes', d * .6)}"><span class="ic" style="background:#12B76A">✓</span><div><div class="t1">Quote accepted · ${geld(s.totaal)}</div><div class="t2">Signed online by ${esc(s.klant)}</div></div><span class="tijdje">9:21</span></div>
      <div class="notif" data-in="${wt(s, 'yes', d * .6) + .5}"><span class="ic" style="background:var(--acc);color:var(--accfg)">$</span><div><div class="t1">Deposit requested · ${geld(s.aanbetaling)}</div><div class="t2">Job ready to book</div></div><span class="tijdje">9:21</span></div>
    </div>`}),
  // ---- algemene scènes voor alle diensten ----
  hook: (s, d) => ({kleur: 'donker', html: `
    ${s.groot ? `<div class="groot" data-in="0">${esc(s.groot)}</div>` : ''}
    <div class="kop" data-in="${s.groot ? .3 : 0}">${mk(s.kop, d * .55)}</div>
    ${s.tekst ? `<div><span class="chip" data-in="${d * .45}">${esc(s.tekst)}</span></div>` : ''}`}),
  telefoon: (s, d) => ({kleur: 'donker', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="tel" data-in="0.15">
      <div class="tel-kop"><span class="av">${esc((s.bedrijf || '?')[0])}</span><div><b>${esc(s.bedrijf)}</b><small>Incoming call · AI receptionist</small></div><span class="live"><i></i>Live</span></div>
      ${s.items.map((it, n) => `<div class="tel-regel ${it.a === 'ai' ? 'ai' : 'klant'}" data-in="${tijd(s, n, d)}"><small>${it.a === 'ai' ? 'AI RECEPTIONIST' : 'CALLER'}</small>${esc(it.b)}</div>`).join('')}
    </div>
    ${s.resultaat ? `<div><span class="chip" data-in="${tijd(s, s.items.length, d)}"><span class="vink">✓</span>${esc(s.resultaat)}</span></div>` : ''}`}),
  chat: (s, d) => {
    const wa = s.kanaal === 'whatsapp' ? 'whatsapp' : '';
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="chatapp" data-in="0.15">
      <div class="chatapp-kop ${wa}"><span class="av">${esc((s.bedrijf || '?')[0])}</span><div><b>${esc(s.bedrijf)}</b><small>${wa ? 'online' : 'AI assistant · replies instantly'}</small></div></div>
      <div class="chatapp-veld ${wa}">
        ${s.items.map((it, n) => it.a === 'ai'
          ? `<div class="puntjes" data-in="${tijd(s, n, d) - .7}" data-uit="${tijd(s, n, d) - .05}"><i></i><i></i><i></i></div><div class="bel ai" data-in="${tijd(s, n, d)}">${esc(it.b)}<small>${esc(it.c || '')}</small></div>`
          : `<div class="bel klant" data-in="${tijd(s, n, d)}">${esc(it.b)}<small>${esc(it.c || '')}</small></div>`).join('')}
      </div>
    </div>`};
  },
  agenda: (s, d) => {
    const dagen = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'], uur = x => { const [h, m] = x.split(':').map(Number); return h + m / 60; };
    let k = 0;
    const blokken = s.items.map(it => {
      const top = (uur(it.b) - 8) * 78, h = Math.max(56, (uur(it.c) - uur(it.b)) * 78 - 6);
      const tin = it.nieuw ? tijd(s, k++, d) : .15;
      return {dag: dagen.indexOf(it.a), html: `<div class="blok ${it.nieuw ? 'nieuw' : ''}" style="top:${top}px;height:${h}px" data-in="${tin}">${esc(it.d)}<small>${esc(it.b)}</small></div>`};
    });
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="app" data-in="0.1"><div class="app-kop"><span class="logo" style="background:#1F5EFF">${esc((s.bedrijf || '?')[0])}</span><b>${esc(s.bedrijf)}</b><span class="nr">This week</span></div>
      <div class="agenda">${dagen.map((dg, i) => `<div><div class="dag">${dg}</div><div class="kolom">${blokken.filter(b => b.dag === i).map(b => b.html).join('')}</div></div>`).join('')}</div>
    </div>`};
  },
  inbox: (s, d) => ({kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="app" data-in="0.1"><div class="app-kop"><span class="logo" style="background:#1F5EFF">✉</span><b>Inbox</b><span class="nr">${esc(s.bedrijf || '')}</span></div>
      ${s.items.map((it, n) => `<div class="mailrij"><span class="av">${esc(it.a[0])}</span><div class="tekst"><b>${esc(it.a)}</b><span class="ond">${esc(it.b)}</span></div><span class="label" data-in="${tijd(s, n, d)}">${esc(it.c)}</span></div>`).join('')}
    </div>
    ${s.resultaat ? `<div><span class="chip" data-in="${tijd(s, s.items.length, d)}"><span class="vink">✓</span>${esc(s.resultaat)}</span></div>` : ''}`}),
  document: (s, d) => ({kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="doc" data-in="0.1"><div class="scanlijn" data-scan="${tijd(s, 0, d) - .9}"></div>
      <div class="doc-kop">${esc(s.bedrijf || 'Document')}<small>${esc(s.tekst || 'SCANNED')}</small></div>
      ${s.items.map((it, n) => `<div class="veld" data-in="${tijd(s, n, d)}"><span>${esc(it.a)}</span><b>${esc(it.b)}</b></div>`).join('')}
    </div>
    ${s.resultaat ? `<div><span class="chip" data-in="${tijd(s, s.items.length, d)}"><span class="vink">✓</span>${esc(s.resultaat)}</span></div>` : ''}`}),
  dashboard: (s, d) => {
    const pts = (s.getallen || []).length ? s.getallen : [3, 4, 3.6, 5, 4.8, 6, 7];
    const mx = Math.max(...pts), mn = Math.min(...pts), w = 900, h = 240;
    const lijn = pts.map((v, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${(h - 20 - (v - mn) / ((mx - mn) || 1) * (h - 40)).toFixed(1)}`).join(' ');
    return {kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="tegels">${s.items.map((it, n) => `<div class="tegel" data-in="${tijd(s, n, d)}"><small>${esc(it.a)}</small><b data-count="${parseFloat(it.b)}" data-t0="${tijd(s, n, d)}" data-dur="1.0" data-pre="${esc(it.c || '')}" data-suf="${esc(it.d || '')}" data-dec="${(String(it.b).split('.')[1] || '').length}">0</b></div>`).join('')}</div>
    <div class="grafiek" data-in="${tijd(s, 0, d)}"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${lijn}" fill="none" stroke="#1F5EFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" data-teken="${tijd(s, 0, d)}"/></svg></div>
    ${s.resultaat ? `<div class="alert" data-in="${tijd(s, s.items.length, d)}">⚠ ${esc(s.resultaat)}</div>` : ''}`};
  },
  checklist: (s, d) => ({kleur: 'licht', html: `
    <div class="kop klein" data-in="0">${mk(s.kop, d * .7)}</div>
    <div class="app" data-in="0.1"><div class="app-kop"><span class="logo" style="background:#1F5EFF">${esc((s.bedrijf || '?')[0])}</span><b>${esc(s.bedrijf)}</b><span class="nr">${esc(s.tekst || 'Automated')}</span></div>
      ${s.items.map((it, n) => `<div class="taak" data-af="${tijd(s, n, d)}"><span class="box">✓</span><span>${esc(it.a)}</span></div>`).join('')}
    </div>
    ${s.resultaat ? `<div><span class="chip" data-in="${tijd(s, s.items.length, d)}"><span class="vink">✓</span>${esc(s.resultaat)}</span></div>` : ''}`}),
  notificaties: (s, d) => ({kleur: 'donker', html: `
    <div class="kop" data-in="0">${mk(s.kop, d * .6)}</div>
    <div style="margin-top:60px">${s.items.map((it, n) => `<div class="notif" data-in="${tijd(s, n, d)}"><span class="ic" style="background:${['#12B76A', '#1F5EFF', '#F79009', '#7A5AF8'][n % 4]}">${esc(it.a)}</span><div><div class="t1">${esc(it.b)}</div><div class="t2">${esc(it.c)}</div></div><span class="tijdje">${esc(it.d)}</span></div>`).join('')}</div>`}),
  eind: (s, d) => ({kleur: 'donker', html: `
    <div class="kop" style="margin-top:120px" data-in="0">${mk(s.kop, d * .35)}</div>
    <div class="knop" data-in="${wt(s, "send", d * .55) - .1}">${esc(s.knop)}</div>
    <div class="handle" data-in="${wt(s, "dm", d * .65)}">${esc(s.handle)}</div>`}),
};

let spec = null, huidig = -1;
window.__laad = s => {
  spec = s;
  Object.entries(s.kleuren || {}).forEach(([k, v]) => document.documentElement.style.setProperty('--' + k, v));
};

function bouw(i) {
  const sc = spec.scenes[i], uit = SCENES[sc.type](sc, sc.dur);
  const el = document.getElementById('scene');
  el.className = uit.kleur;
  document.body.className = uit.kleur;
  el.innerHTML = `<div class="inhoud">${uit.html}</div>`;
  huidig = i;
}

function werk(t, d, laatste) {
  const r = document.getElementById('scene');
  // inhoud glijdt aan het eind van de scène omhoog weg, zodat de volgende er vloeiend op aansluit
  const weg = laatste ? 0 : E((t - (d - UIT)) / UIT), w = r.firstElementChild;
  w.style.opacity = 1 - weg;
  w.style.transform = `translateY(${-50 * weg}px)`;
  w.style.filter = weg > 0 ? `blur(${weg * 10}px)` : '';
  r.querySelectorAll('[data-in]').forEach(el => {
    const p = E((t - +el.dataset.in) / IN);
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 30}px)`;
    el.style.filter = p < 1 ? `blur(${(1 - p) * 10}px)` : '';
  });
  r.querySelectorAll('[data-uit]').forEach(el => { el.style.opacity = 1 - E((t - +el.dataset.uit) / .25); });
  r.querySelectorAll('[data-klik]').forEach(el => {
    const x = (t - +el.dataset.klik) / .16, p = x > -1 && x < 1 ? 1 - Math.abs(x) : 0;
    el.style.transform = `scale(${1 - .18 * p})`;
  });
  r.querySelectorAll('[data-ring]').forEach(el => {
    const x = (t - +el.dataset.ring) / .5;
    el.style.opacity = x > 0 && x < 1 ? .7 * (1 - x) : 0;
    el.style.transform = `scale(${.4 + .8 * cl(x)})`;
  });
  r.querySelectorAll('[data-af]').forEach(el => el.classList.toggle('af', t >= +el.dataset.af));
  r.querySelectorAll('[data-scan]').forEach(el => {
    const x = (t - +el.dataset.scan) / 1.0;
    el.style.opacity = x > 0 && x < 1 ? 1 : 0;
    el.style.top = `${cl(x) * 100}%`;
  });
  r.querySelectorAll('[data-teken]').forEach(el => { el.style.strokeDashoffset = 1 - E((t - +el.dataset.teken) / 1.4); });
  r.querySelectorAll('[data-hl]').forEach(el => el.style.setProperty('--hl', E((t - +el.dataset.hl) / .5)));
  r.querySelectorAll('[data-dim]').forEach(el => {
    const p = E((t - +el.dataset.dim) / .6);
    el.style.opacity = 1 - .62 * p;
    el.style.textDecoration = p > .5 ? 'line-through' : '';
  });
  r.querySelectorAll('[data-count]').forEach(el => {
    const p = E((t - +el.dataset.t0) / +el.dataset.dur), van = +(el.dataset.van || 0), tot = +el.dataset.count;
    const v = van + (tot - van) * p, dec = +(el.dataset.dec || 0);
    el.textContent = (el.dataset.pre || '') + v.toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}) + (el.dataset.suf || '');
  });
  // teller = som van de meldingen die al in beeld zijn (bedragen kloppen op elk moment)
  r.querySelectorAll('[data-som]').forEach(el => {
    const v = JSON.parse(el.dataset.som).reduce((a, [t0, bedrag]) => a + bedrag * E((t - t0) / .6), 0);
    el.textContent = '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  });
  r.querySelectorAll('[data-typ]').forEach(el => {
    const tekst = el.dataset.typ, n = Math.floor(cl((t - +el.dataset.t0) * 20 / tekst.length) * tekst.length);
    const klaar = n >= tekst.length, aan = !klaar || Math.floor(t * 2.2) % 2 === 0;
    el.innerHTML = esc(tekst.slice(0, n)) + (t >= +el.dataset.t0 ? `<span class="caret" style="opacity:${aan ? 1 : 0}"></span>` : '');
  });
}

function ondertitel(t) {
  const c = document.getElementById('cap');
  if (!spec.captions) return;
  const blok = spec.captions.find(b => t >= b.s && t <= b.e + .2);
  c.innerHTML = blok ? blok.w.map(w => `<span class="${t >= w.s ? 'aan' : ''}">${esc(w.w)}</span>`).join(' ') : '';
}

window.__zet = t => {
  let i = 0;
  while (i + 1 < spec.scenes.length && t >= spec.scenes[i + 1].start) i++;
  if (i !== huidig) bouw(i);
  werk(t - spec.scenes[i].start, spec.scenes[i].dur, i === spec.scenes.length - 1);
  ondertitel(t);
};
</script>
</body></html>
