<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagina niet gevonden | Insightance</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: 'Inter'; font-weight: 400 700; font-display: swap; src: url('/fonts/inter-latin.woff2') format('woff2'); }
@font-face { font-family: 'Playfair Display'; font-weight: 500 700; font-display: swap; src: url('/fonts/playfair-latin.woff2') format('woff2'); }
:root { --navy: #17345F; --bright: #1F5EFF; --bright-hover: #1449D6; --tint: #EAF1FB; --muted: #465369; --line: #C9D5E4; }
* { box-sizing: border-box; margin: 0; }
body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--navy); background: radial-gradient(80% 70% at 85% 0%, var(--tint) 0%, #fff 60%); min-height: 100vh; display: flex; flex-direction: column; padding: 0 24px; position: relative; overflow-x: hidden; }
header { max-width: 1280px; width: 100%; margin: 0 auto; padding: 24px 0; }
.logo { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--navy); font-weight: 600; font-size: 15px; letter-spacing: .24em; }
main { flex: 1; display: grid; place-items: center; padding: 48px 0 140px; position: relative; z-index: 1; }
.box { max-width: 560px; text-align: center; }
.code { font-size: 13px; font-weight: 600; letter-spacing: .18em; color: var(--bright); }
h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: clamp(34px, 6vw, 52px); line-height: 1.1; margin: 14px 0 16px; text-wrap: balance; }
p { color: var(--muted); font-size: 17px; line-height: 1.6; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: 100px; font-weight: 600; font-size: 15px; text-decoration: none; transition: background .2s, border-color .2s; }
.btn.p { background: var(--bright); color: #fff; box-shadow: 0 10px 24px -10px rgba(31,94,255,.6); }
.btn.p:hover { background: var(--bright-hover); }
.btn.s { border: 1px solid var(--line); color: var(--navy); background: #fff; }
.btn.s:hover { border-color: var(--navy); }
svg.line { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 160px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><svg width="34" height="34" viewBox="0 0 44 44" fill="none" aria-hidden="true"><rect x="19" y="6" width="6" height="32" rx="1" fill="#17345F"/><path d="M8 36 Q14 28 22 22 Q30 16 36 8" stroke="#3D6AA8" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="8" cy="36" r="2.8" fill="#3D6AA8"/><circle cx="36" cy="8" r="2.8" fill="#3D6AA8"/></svg>INSIGHTANCE</a>
</header>
<main>
  <div class="box">
    <div class="code">FOUT 404</div>
    <h1>Deze pagina bestaat niet (meer)</h1>
    <p>De link is misschien verouderd of er zit een typfout in. Via de homepage vind je alles terug.</p>
    <div class="btns">
      <a class="btn p" href="/">Naar de homepage</a>
      <a class="btn s" href="/#contact">Plan een gesprek</a>
    </div>
  </div>
</main>
<svg class="line" viewBox="0 0 1440 160" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M-10 140 C 400 140, 820 130, 1080 100 C 1250 80, 1350 40, 1450 0" stroke="#1F5EFF" stroke-opacity=".35" stroke-width="2"/></svg>
</body>
</html>
